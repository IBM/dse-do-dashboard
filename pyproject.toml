[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dse-do-dashboard"
dynamic = ["version"]
description = "Decision Optimization Dashboard for IBM Cloud Pak for Data DO projects"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Victor Terpstra", email = "vterpstra@us.ibm.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "dash>=4.1.0",
    "dash-ag-grid>=35.2.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-bootstrap-templates>=2.1.0",
    "dash-daq>=0.6.0",
    "dash-pivottable>=0.0.2",
    "diskcache>=5.6.3",
    "docplex>=2.32.264",
    "flask-caching>=2.3.1",
    "folium>=0.20.0",
    "ibm-watson-machine-learning>=1.0.368",
    "m2r2>=0.3.4",
    "multiprocess>=0.70.19",
    "nbformat==5.1.3",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=2.1.1",
    "plotly>=6.7.0",
    "psutil>=7.2.2",
    "sqlalchemy>=2.0.49",
    "wheel==0.36.2",
]

[project.urls]
Source = "https://github.com/IBM/dse-do-dashboard"
Documentation = "https://ibm.github.io/dse-do-dashboard/"
"IBM Decision Optimization" = "https://www.ibm.com/analytics/decision-optimization"

[tool.setuptools.dynamic]
version = {attr = "dse_do_dashboard.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
