[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dse-do-dashboard"
dynamic = ["version"]
description = "Decision Optimization Dashboard for IBM Cloud Pak for Data DO projects"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Victor Terpstra", email = "vterpstra@us.ibm.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.8",
    "Operating System :: OS Independent",
    "Topic :: Documentation :: Sphinx",
]
dependencies = [
    "dash",
    "dash-ag-grid",
    "dash-bootstrap-components",
    "dash-bootstrap-templates",
    "dash-daq",
    "dash-pivottable",
    "diskcache",
    "docplex",
    "flask-caching",
    "folium",
    "ibm-watson-machine-learning",
    "m2r2",
    "multiprocess",
    "nbformat",
    "numpy",
    "openpyxl",
    "pandas",
    "plotly",
    "psutil",
    "sqlalchemy",
    "wheel",
]

[project.urls]
Source = "https://github.com/IBM/dse-do-dashboard"
Documentation = "https://ibm.github.io/dse-do-dashboard/"
"IBM Decision Optimization" = "https://www.ibm.com/analytics/decision-optimization"

[tool.setuptools.dynamic]
version = {attr = "dse_do_dashboard.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
